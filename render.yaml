# Blueprint de Render — define el servicio del backend como código.
# Con esto, Render puede crear el Web Service automáticamente leyendo
# este archivo (Dashboard > New > Blueprint), sin configurar nada a mano.
#
# La base de datos NO se define acá a propósito: usamos Neon (externo)
# en vez del Postgres de Render, para evitar la expiración a 30 días
# del plan free de Render Postgres.

services:
  - type: web
    name: instituto-erp-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # "alembic upgrade head" aplica las migraciones nuevas (usuarios,
    # unicidad de asistencia docente) y "python -m app.db.seed" crea el
    # usuario administrador SOLO si la tabla "usuarios" está vacía todavía
    # (no pisa la contraseña si ya la cambiaste) -- por eso es seguro que
    # corra en cada arranque, no solo la primera vez.
    startCommand: "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false   # se carga a mano en el dashboard (viene de Neon)
      - key: APP_NAME
        value: "Instituto ERP"
      - key: ENV
        value: "production"
      - key: CORS_ORIGINS
        sync: false   # se carga a mano: URL del frontend en Cloudflare Pages
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_TIMEZONE
        value: "America/Argentina/Buenos_Aires"
      # --- Autenticación (nuevo) ---
      - key: JWT_SECRET_KEY
        sync: false   # OBLIGATORIO: generar un valor propio y secreto en el dashboard,
                       # nunca dejar el default del código en producción.
      - key: ADMIN_USERNAME
        sync: false   # usuario del admin que crea el seed la primera vez
      - key: ADMIN_PASSWORD
        sync: false   # contraseña inicial; cambiarla desde la app después del primer login
